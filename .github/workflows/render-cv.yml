name: Validate CV assets

on:
  push:
    branches: [main, master]
    paths:
      - "_data/cv.yml"
      - "_pages/cv.md"
      - "assets/pdf/Stroecker_Emil_CV.pdf"
      - ".github/workflows/render-cv.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "_data/cv.yml"
      - "_pages/cv.md"
      - "assets/pdf/Stroecker_Emil_CV.pdf"
      - ".github/workflows/render-cv.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-cv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Validate CV data
        run: |
          ruby -ryaml -e '
            data = YAML.safe_load_file("_data/cv.yml", aliases: true)
            cv = data.fetch("cv")
            abort "CV name is missing" if cv["name"].to_s.empty?
            sections = cv.fetch("sections")
            abort "CV sections are missing" unless sections.is_a?(Hash) && !sections.empty?
          '

      - name: Validate linked PDF
        run: |
          test -s assets/pdf/Stroecker_Emil_CV.pdf
          test "$(head -c 5 assets/pdf/Stroecker_Emil_CV.pdf)" = "%PDF-"
