name: Update Google Scholar Citations

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-citations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check Google Scholar configuration
        id: config
        shell: bash
        run: |
          if grep -Eq '^[[:space:]]*scholar_userid:[[:space:]]*[^#[:space:]]+' _data/socials.yml; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Google Scholar updates are disabled because _data/socials.yml has no scholar_userid." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Python
        if: steps.config.outputs.enabled == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        if: steps.config.outputs.enabled == 'true'
        run: pip install pyyaml scholarly

      - name: Run citation update script
        if: steps.config.outputs.enabled == 'true'
        run: timeout 90 python bin/update_scholar_citations.py

      - name: Commit and push if changed
        if: steps.config.outputs.enabled == 'true'
        run: |
          if [ -z "$(git status --porcelain -- _data/citations.yml)" ]; then
            echo "Citation data is already current." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add _data/citations.yml
          git commit -m "Update Google Scholar citations"
          git push
