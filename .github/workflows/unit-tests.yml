name: Site checks

on:
  push:
    branches: [main, master]
    paths:
      - "Gemfile"
      - "Gemfile.lock"
      - "_config.yml"
      - "_bibliography/**"
      - "_data/**"
      - "_includes/**"
      - "_layouts/**"
      - "_news/**"
      - "_pages/**"
      - "_projects/**"
      - "assets/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".al-folio-overrides.yml"
      - ".github/workflows/unit-tests.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "Gemfile"
      - "Gemfile.lock"
      - "_config.yml"
      - "_bibliography/**"
      - "_data/**"
      - "_includes/**"
      - "_layouts/**"
      - "_news/**"
      - "_pages/**"
      - "_projects/**"
      - "assets/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".al-folio-overrides.yml"
      - ".github/workflows/unit-tests.yml"

jobs:
  site-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Node 🧰
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install JS dependencies 📦
        run: npm ci

      - name: Run style contract lint 🧷
        run: npm run lint:style-contract

      - name: Audit local theme overrides 🧩
        run: bundle exec al-folio upgrade overrides audit

      - name: Install build prerequisites 🔧
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Build production site 🏗️
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - name: Verify primary output 🔎
        run: |
          for site_path in \
            index.html \
            cv/index.html \
            publications/index.html \
            projects/index.html \
            news/index.html \
            sitemap.xml \
            feed.xml \
            assets/pdf/Stroecker_Emil_CV.pdf
          do
            test -s "_site/$site_path"
          done

      - name: Run CSS minification regression 🎨
        run: bash test/integration_css_minify.sh
